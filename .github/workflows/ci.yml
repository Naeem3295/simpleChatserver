name: CI - Build & Validate

on:
  push:
    branches: [dev, stage, prod]
  pull_request:
    branches: [dev, stage, prod]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Docker build (validation only, no push)
        run: |
          docker build -f Dockerfile.dev -t backend:dev-validate .
          docker build -f Dockerfile.prod -t backend:prod-validate .
